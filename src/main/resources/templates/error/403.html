<!doctype html>
<html lang="ru" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Доступ запрещён</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Help Desk</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Главная</a>
            <a class="nav-link" th:href="@{/about}">О нас</a>
            <a class="nav-link" th:href="@{/contacts}">Контакты</a>
            <a class="nav-link" th:href="@{/admin/tickets}">Админ-панель</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row align-items-center g-4">
        <div class="col-lg-7">
            <h1 class="fw-bold display-4 text-danger">403</h1>
            <h2 class="fw-bold">Доступ запрещён</h2>
            <p class="lead">
                У вас недостаточно прав для просмотра этой страницы.
            </p>
            <div class="d-flex gap-2 mt-4">
                <a th:href="@{/}" class="btn btn-primary">На главную</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-secondary">
                        Выйти из учётной записи
                    </button>
                </form>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Что произошло?</h2>
                    <p class="mb-0">
                        Эта страница доступна только пользователям с соответствующими
                        правами доступа. Если вы считаете, что это ошибка, обратитесь
                        к администратору.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
